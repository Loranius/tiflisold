name: Security audit

on:
  pull_request:
  push:
    branches:
      - main
      - security/phase-0

permissions:
  contents: read

jobs:
  browser-secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan deployable browser files
        run: python3 scripts/check-secrets.py
